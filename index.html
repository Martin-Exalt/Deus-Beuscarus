<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Deus Beuscarus</title>
<style>
:root{
  --bg:#ffffff; --surface:#f3f4f6; --text:#1f2328; --muted:#5b636e;
  --line:#d0d4da; --accent:#2f5bd3; --accent-text:#ffffff; --ok:#1d7a3e; --warn:#b3261e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16181c; --surface:#22252b; --text:#e8eaed; --muted:#a0a7b1;
    --line:#3a3f47; --accent:#7d9cf0; --accent-text:#10131a; --ok:#6fcf8f; --warn:#f2867c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16181c; --surface:#22252b; --text:#e8eaed; --muted:#a0a7b1;
  --line:#3a3f47; --accent:#7d9cf0; --accent-text:#10131a; --ok:#6fcf8f; --warn:#f2867c;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:0 0 12px}
h2{font-size:1.15rem;margin:20px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
html,body,button,select,input,label,a{touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
select,input,textarea{font-size:16px}
.vues{display:flex;gap:4px;padding:4px;margin:0 0 12px;border-radius:12px;background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 0 0 6px var(--bg)}
.vues button{flex:1;text-align:center;padding:9px 10px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;position:relative}
.vues button[aria-selected="true"]{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.vues .a-toi{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.plat.vue-tel{background:none;padding:0;border:0;box-shadow:none;margin:0}
.vue-tel .panneau{padding:12px}
.vue-tel .roue-boite{padding:4px}
.vue-tel .jr .badge{white-space:normal}
.vue-tel .jr .jobj{width:32px;height:32px}
.vue-tel .jr .jobj .ico{width:20px;height:20px}
.vue-tel .jr{padding:10px 12px;gap:10px}
.vue-tel .jr .tot{font-size:1.35rem}
button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
label{display:block;margin:10px 0 4px;color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;background:var(--bg)}
.code{font-size:3rem;font-weight:700;letter-spacing:.2em}
.rejoindre{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.qr{background:#fff;border-radius:12px;padding:6px;width:200px;max-width:100%;line-height:0}.qr svg{width:100%;height:auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th:first-child,td:first-child{text-align:left}
tr.current td{background:var(--surface);font-weight:600}
td.done{color:var(--ok);font-weight:700}
.gods{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.gods button{text-align:left;padding:14px}
.card{border:2px solid var(--accent);border-radius:10px;padding:14px;margin:10px 0}
.alloc{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 10px;align-items:center}
.alloc button{padding:6px 12px}
.err{color:var(--warn)}
.jauge{display:inline-flex;gap:2px;margin-top:6px}
.jauge span{font-size:1.1rem;opacity:.3;filter:grayscale(1)}
.jauge span.on{opacity:1;filter:none;font-size:1.4rem}
ul.log{padding-left:18px;margin:0}
ul.log li{margin:2px 0}
.cards{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem;background:var(--surface)}
.desc{color:var(--muted);font-size:.95rem;margin:6px 0 0}
.pick{display:grid;gap:8px}
.pick button{text-align:left}
.pick button.sel{border-color:var(--accent);outline:2px solid var(--accent)}
.small{font-size:.9rem}
.ico{width:1.25em;height:1.25em;vertical-align:-.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico .pl{fill:currentColor;stroke:none}
.prog{display:grid;gap:2px;margin:6px 0 4px}
.pr{display:grid;grid-template-columns:7.2em 1fr 2.4em;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:6px;padding:7px 2px;text-align:left;color:var(--text)}
.pr .pn{font-size:.92rem;white-space:nowrap}
.barre{position:relative;height:6px;border-radius:3px;background:var(--surface)}
.barre>span{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--c,var(--accent))}
.barre>i{position:absolute;top:-4px;width:2px;height:14px;border-radius:1px;background:var(--accent);opacity:.55}
.pr .pv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pr.ok .pv{color:var(--ok)}
.pr-eff{font-size:.88rem;color:var(--muted);padding:2px 2px 10px}
.prog-tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.attente{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.objet-carte{display:flex;gap:12px;align-items:flex-start}
.objet-carte .ico{width:34px;height:34px;color:var(--accent);margin-top:2px}
.gods .ico{width:22px;height:22px}
.pick .objet-carte{display:flex}.pick .objet-carte .ico{width:30px;height:30px}

/* ---- Plateau ---- */
.plat{
  --bg:#f4f6f9; --surface:#ffffff; --text:#12151b; --muted:#5d6574; --line:#d9dee6; --accent:#3b5bdb; --accent-text:#fff;
  --j0:#e8590c; --j1:#1c7ed6; --j2:#2b8a3e; --j3:#9c36b5; --j4:#d49b00; --j5:#d6336c;
  background:var(--bg); color:var(--text); border-radius:18px; padding:20px; container-type:inline-size;
  font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .plat{
  --bg:#0e1117; --surface:#171b23; --text:#e9ecf2; --muted:#98a1b0; --line:#2a303b; --accent:#8ea6ff; --accent-text:#0e1117;
  --j0:#ff8a3d; --j1:#4dabf7; --j2:#51cf66; --j3:#da77f2; --j4:#fcc419; --j5:#f06595; } }
:root[data-theme="dark"] .plat{
  --bg:#0e1117; --surface:#171b23; --text:#e9ecf2; --muted:#98a1b0; --line:#2a303b; --accent:#8ea6ff; --accent-text:#0e1117;
  --j0:#ff8a3d; --j1:#4dabf7; --j2:#51cf66; --j3:#da77f2; --j4:#fcc419; --j5:#f06595; }
body{--j0:#e8590c; --j1:#1c7ed6; --j2:#2b8a3e; --j3:#9c36b5; --j4:#d49b00; --j5:#d6336c}
.plat h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em;margin:0}
.plat h2{font-size:1rem;font-weight:600;margin:22px 0 8px}
.plat .tete{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.plat .meta{display:flex;gap:16px;align-items:baseline;color:var(--muted)}
.plat .meta strong{color:var(--text);font-size:1.25rem;letter-spacing:.12em}
.plat .grille{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:24px;align-items:start}
@container (max-width:760px){ .plat .grille{grid-template-columns:1fr} }
.plat .panneau{background:var(--surface);border-radius:14px;padding:16px}
.plat button{border-radius:10px}
.roue{width:100%;height:auto;display:block}
.roue .rayon{stroke:var(--line);stroke-width:1.5}
.roue .anneau{fill:none;stroke:var(--line);stroke-dasharray:3 5}
.roue .anneau.fin{stroke:var(--text);stroke-dasharray:none;opacity:.35;stroke-width:2}
.roue .anneau.mi{stroke:var(--accent);stroke-dasharray:none;opacity:.5;stroke-width:1.5}
.roue .graduation{fill:var(--muted);font-size:13px}
.roue .noeud{cursor:pointer}
.roue .noeud rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.roue .noeud.sel rect,.roue .noeud:focus-visible rect{stroke:var(--accent);stroke-width:3}
.roue .noeud:focus{outline:none}
.roue .noeud text{fill:var(--text);font-size:19px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.roue .centre{fill:var(--surface);stroke:var(--line)}
.roue .centre-t{fill:var(--text);font-size:16px;font-weight:600;text-anchor:middle}
.roue .trace{stroke-linecap:round;stroke-width:6}
.roue .pion{stroke:var(--surface);stroke-width:2.5}
.etat{border-left:6px solid var(--c,var(--accent))}
.etat .qui{font-size:1.35rem;font-weight:700}
.annonce{border-left:6px solid var(--c);background:var(--surface);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.annonce .t{font-weight:600}
.annonce .eff{color:var(--muted);margin:2px 0}
.annonce .res{font-weight:500}
.joueurs{display:grid;gap:8px}
.jr{width:100%;display:grid;grid-template-columns:14px minmax(0,1fr) auto auto 12px;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid transparent;padding:12px 14px}
.jr.actif{border-color:var(--c)}
.jr .pastille{width:14px;height:14px;border-radius:50%;background:var(--c)}
.jr .nom{font-weight:600}
.jr .sous{color:var(--muted);font-size:.85rem}
.jr .tot{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.jr .jobj{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.jr .jobj .ico{width:26px;height:26px}
.jr .info{display:grid;gap:3px;justify-items:start;min-width:0}
.jr .badge{font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.jr .badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.jr .badge.go{color:var(--text);background:color-mix(in srgb,var(--c) 18%,transparent)}
.jr .sel{font-size:.85rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.jr .tot{display:grid;justify-items:end;line-height:1}
.jr .tot small{font-size:.8rem;font-weight:600;color:var(--muted);margin-top:4px}
.jr .tri{color:var(--muted);font-size:.9rem;transition:transform .15s}
.jr[aria-expanded="true"] .tri{transform:rotate(180deg)}
.pcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pc{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:600;padding:2px 7px 2px 5px;border-radius:7px;color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.pc .ico{width:15px;height:15px}
.note{border-left:4px solid var(--accent);background:var(--surface);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.92rem}
.note.vide{border-left-color:var(--warn)}
.note.vide strong{color:var(--warn)}
.roue .mi-t{fill:var(--accent);font-size:10px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;letter-spacing:.01em}
.revele{display:grid;gap:8px;margin-top:10px}
.detail{background:var(--surface);border-radius:0 0 12px 12px;margin-top:-10px;padding:14px 14px 12px}
.detail .objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.detail .o{border:1px solid var(--line);border-radius:8px;padding:4px 8px;display:flex;justify-content:space-between}
.detail .o.ok{background:var(--c);border-color:var(--c);color:var(--surface);font-weight:600}
.cloche-anim{position:fixed;inset:0;display:grid;place-items:center;z-index:50;pointer-events:none;animation:clFond 2.4s ease forwards}
.cloche-anim>div{display:grid;justify-items:center;gap:6px;background:var(--surface,#fff);color:var(--text,#111);border-radius:24px;padding:28px 44px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:clPop 2.4s ease forwards}
.cloche-anim .cl .ico{width:4.5rem;height:4.5rem}
.taureau-anim .bete .ico{width:11rem;height:11rem;stroke-width:1.4}
.cloche-anim .cl{display:inline-block;line-height:0;animation:clBalance .35s ease-in-out 5 alternate;transform-origin:50% 10%}
.cloche-anim strong{font-size:3rem;letter-spacing:.06em;font-family:"Outfit",system-ui,sans-serif}
@keyframes clBalance{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes clPop{0%{transform:scale(.4);opacity:0}12%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(.95)}}
@keyframes clFond{0%{background:rgba(0,0,0,0)}12%{background:rgba(0,0,0,.25)}85%{background:rgba(0,0,0,.25)}100%{background:rgba(0,0,0,0)}}
@media (prefers-reduced-motion: reduce){.cloche-anim .cl,.cloche-anim>div{animation:none}}
.piece-anim{position:fixed;inset:0;display:grid;place-items:center;z-index:50;pointer-events:none;animation:clFond 3.4s ease forwards}
.piece-anim .boite{display:grid;justify-items:center;gap:8px;background:var(--surface,#fff);color:var(--text,#111);border-radius:24px;padding:26px 40px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:clPop 3.4s ease forwards;perspective:600px;font-family:"Outfit",system-ui,sans-serif}
.piece-anim strong{font-size:2rem;opacity:0;animation:apparait 3.4s ease forwards}
.piece-anim .boite>span{opacity:0;animation:apparait 3.4s ease forwards}
.piece{width:110px;height:110px;position:relative;transform-style:preserve-3d}
.piece span{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-weight:700;letter-spacing:.08em;backface-visibility:hidden;
  background:radial-gradient(circle at 35% 30%,#ffe9a3,#d9a514 60%,#a8780a);color:#5a3d00;box-shadow:inset 0 0 0 6px #c4920f,inset 0 0 0 9px #ffe38a}
.piece .f2{transform:rotateY(180deg)}
.piece.pile{animation:lancePile 1.8s cubic-bezier(.2,.7,.3,1) forwards}
.piece.face{animation:lanceFace 1.8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes lancePile{0%{transform:translateY(0) rotateY(0)}40%{transform:translateY(-70px) rotateY(1080deg)}100%{transform:translateY(0) rotateY(1800deg)}}
@keyframes lanceFace{0%{transform:translateY(0) rotateY(0)}40%{transform:translateY(-70px) rotateY(1080deg)}100%{transform:translateY(0) rotateY(1980deg)}}
@keyframes apparait{0%,52%{opacity:0}60%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.piece.pile{animation:none}.piece.face{animation:none;transform:rotateY(180deg)}}
.taureau-anim{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;z-index:50;pointer-events:none;overflow:hidden;color:var(--text,#111);animation:clFond 2.6s ease forwards}
.taureau-anim .bete{line-height:0;color:var(--text,#111);transform:scaleX(-1);animation:charge 2.6s cubic-bezier(.5,0,.6,1) forwards}
.taureau-anim strong{font-size:2.6rem;font-family:"Outfit",system-ui,sans-serif;background:var(--surface,#fff);padding:4px 18px;border-radius:12px;animation:clPop 2.6s ease forwards}
.taureau-anim>span:last-child{background:var(--surface,#fff);padding:2px 12px;border-radius:8px;animation:clPop 2.6s ease forwards}
@keyframes charge{0%{transform:translateX(-70vw) scaleX(-1)}45%{transform:translateX(0) scaleX(-1) rotate(-6deg)}55%{transform:translateX(0) scaleX(-1) rotate(4deg)}100%{transform:translateX(70vw) scaleX(-1)}}
@media (prefers-reduced-motion: reduce){.taureau-anim .bete{animation:none}}
.roue-boite{position:relative}
.bulle{position:absolute;z-index:5;width:min(300px,90%);background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.22);pointer-events:none;font-size:.95rem;line-height:1.45}
.bulle .bt{font-weight:700;font-size:1.05rem;margin-bottom:4px}
.bulle p{margin:0 0 6px}
.plat details summary{cursor:pointer;color:var(--muted)}
.plat .card{border-color:var(--line);background:var(--bg)}
main.large{max-width:1500px}
.test{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media (max-width:900px){.test{grid-template-columns:1fr}}
.tel{border:10px solid var(--text);border-radius:28px;padding:14px;height:780px;max-height:85vh;overflow:auto;background:var(--bg);position:sticky;top:8px}
.onglets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.onglets button{padding:6px 10px;font-size:.9rem}
.onglets button.sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
</style>
</head>

/* ---------- réseau pair-à-pair (le plateau héberge la partie) ----------

/* La roue : chaque joueur part du centre, sa couleur monte vers chaque objectif */
function roue() {
  const C = 300, R0 = 46, R = 222, n = OBJECTIFS.length, nj = jeu.ordre.length;
  const ang = k => (-90 + k * 360 / n) * Math.PI / 180;
  const pt = (k, d, off) => { const a = ang(k); return [C + Math.cos(a) * d - Math.sin(a) * off, C + Math.sin(a) * d + Math.cos(a) * off]; };
  const echelle = jeu.ordre.some(id => aObjet(jeu, id, "pinot")) ? MAX_LAISSE_PINOT : MAX_PAR_OBJECTIF;
  const dist = v => R0 + (R - R0) * Math.min(v, echelle) / echelle;
  let h = "";
  [5, SEUIL_MI_PARCOURS, 10, 15, 20].filter(v => v <= echelle).forEach(v => {
    h += `<circle class="anneau ${v === SEUIL_MI_PARCOURS ? "mi" : v === MAX_PAR_OBJECTIF && echelle > MAX_PAR_OBJECTIF ? "fin" : ""}" cx="${C}" cy="${C}" r="${dist(v)}"/>`;
    const [x, y] = pt(-0.5, dist(v), 0);
    h += `<text class="graduation" text-anchor="middle" x="${x}" y="${y + 4}">${v}</text>`;
  });
  OBJECTIFS.forEach((o, k) => { const [x, y] = pt(k, R, 0), [x0, y0] = pt(k, R0, 0); h += `<line class="rayon" x1="${x0}" y1="${y0}" x2="${x}" y2="${y}"/>`; });
  jeu.ordre.forEach((pid, i) => {
    const off = (i - (nj - 1) / 2) * 9, c = couleur(pid);
    OBJECTIFS.forEach((o, k) => {
      const v = jeu.scores[pid][o.id], [x0, y0] = pt(k, R0, off), [x, y] = pt(k, dist(v), off);
      if (v > 0) h += `<line class="trace" x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="${c}" opacity=".85"/>`;
    });
  });
  /* effet du palier 8, écrit le long du cercle bleu, centré sur le rayon de chaque objectif */
  const r8 = dist(SEUIL_MI_PARCOURS), da = 0.44;
  OBJECTIFS.forEach((o, k) => {
    const a = ang(k), bas = Math.sin(a) > 0.2;
    const p1 = [C + Math.cos(a - da) * r8, C + Math.sin(a - da) * r8], p2 = [C + Math.cos(a + da) * r8, C + Math.sin(a + da) * r8];
    const d = bas ? `M${p2[0]} ${p2[1]} A${r8} ${r8} 0 0 0 ${p1[0]} ${p1[1]}` : `M${p1[0]} ${p1[1]} A${r8} ${r8} 0 0 1 ${p2[0]} ${p2[1]}`;
    h += `<path id="mi8-${k}" d="${d}" fill="none" stroke="none"/><text class="mi-t" dy="${bas ? -6 : 13}"><textPath href="#mi8-${k}" startOffset="50%" text-anchor="middle">${esc(MI_COURT[o.id] || "")}</textPath></text>`;
  });
  jeu.ordre.forEach((pid, i) => {
    const off = (i - (nj - 1) / 2) * 9, c = couleur(pid);
    OBJECTIFS.forEach((o, k) => {
      const v = jeu.scores[pid][o.id], [x, y] = pt(k, dist(v), off), ok = jeu.completes[pid].includes(o.id);
      h += `<circle class="pion" cx="${x}" cy="${y}" r="${ok ? 9 : v > 0 ? 6 : 4}" fill="${c}"><title>${esc(jeu.noms[pid])} : ${v} en ${esc(court(o.id))}</title></circle>`;
    });
  });
  OBJECTIFS.forEach((o, k) => {
    const [x, y] = pt(k, R + 42, 0), w = o.court.length * 11 + 58;
    const qui = jeu.ordre.filter(pid => jeu.completes[pid].includes(o.id));
    h += `<g class="noeud ${objSel === o.id ? "sel" : ""}" data-obj="${o.id}" role="button" tabindex="0" aria-label="${esc(o.nom)} : voir l’effet">
      <rect x="${x - w / 2}" y="${y - 20}" width="${w}" height="40" rx="20"/><text x="${x}" y="${y}">${esc(court(o.id))}</text>
      ${qui.map((pid, j) => `<circle cx="${x - (qui.length - 1) * 7 + j * 14}" cy="${y + 30}" r="6" fill="${couleur(pid)}"/>`).join("")}</g>`;
  });
  h += `<circle class="centre" cx="${C}" cy="${C}" r="${R0 - 8}"/><text class="centre-t" x="${C}" y="${C - 3}">Tour ${jeu.manche}</text>`;
  return `<svg class="roue" viewBox="-20 -10 640 630" role="img" aria-label="Progression des joueurs vers les 7 objectifs">${h}</svg>`;
}

function rendreJoueur() {

  if (!jeu) { $app.innerHTML = `<p class="muted">${horsLigne ? "La partie est injoignable pour l’instant." : "Connexion à la partie…"}</p><button id="q">Quitter</button>`; document.getElementById("q").onclick = quitter; return; }
  const me = monId();
  const pied = `<p class="err">${esc(erreur)}</p>${test ? "" : `<p style="margin-top:24px"><button id="q">Quitter la partie</button></p>`}`;
  const bas = () => (jeu.scores?.[me] ? mesScores(me) : "") + pied;
  const avecVues = (jeu.statut === "en_cours" || jeu.statut === "fini") && (jeu.ordre || []).includes(me);
  const fin = () => { const q = document.getElementById("q"); if (q) q.onclick = quitter; lierScores(); lierObjet(me);
    const aMoi = jeu.statut === "en_cours" && doitAgir(jeu, me);
    const vues = avecVues ? `<div class="vues" role="tablist" aria-label="Affichage">
        <button role="tab" data-vt="moi" aria-selected="${vueTel === "moi"}">Mon jeu${aMoi && vueTel !== "moi" ? `<span class="a-toi" title="À toi de jouer"></span>` : ""}</button>

    $app.insertAdjacentHTML("afterbegin", `${vues}<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span style="width:14px;height:14px;border-radius:50%;background:${couleur(me)}"></span><span class="muted small">${esc(jeu.noms[me])}${jeu.manche && jeu.statut === "en_cours" && jeu.phase !== "objets" ? ` · tour ${jeu.manche}` : ""}${aMoi && vueTel !== "moi" ? ` · <strong style="color:var(--text)">à toi de jouer</strong>` : ""}</span></div>`);
    $app.querySelectorAll("[data-vt]").forEach(b => b.onclick = () => { vueTel = b.dataset.vt; window.scrollTo(0, 0); rendre(); }); };
  const attente = (txt) => { const l = jeu.ordre.filter(id => id !== me && doitAgir(jeu, id));
    return `<p>${txt}</p>${l.length ? `<p class="muted small" style="margin-bottom:4px">En attente de :</p><div class="attente">${l.map(id => `<span class="chip">${pastilleJ(id)}${esc(jeu.noms[id])}</span>`).join("")}</div>` : ""}`; };

      const g = {statut:"en_cours", ordre, noms: Object.fromEntries(ordre.map((id, i) => [id, "Joueur " + (i + 1)])), journal: []};

      suivre = true; testVue = ordre[0]; recevoir(g);
    };
    return;
  }
  if (suivre && jeu.statut === "en_cours" && !doitAgir(jeu, testVue)) testVue = jeu.ordre.find(id => enAttente(jeu, id).length) || jeu.ordre.find(id => doitAgir(jeu, id)) || testVue;
  if (!jeu.ordre.includes(testVue)) testVue = jeu.ordre[0];
  main.innerHTML = `<div class="test"><div id="tplat" class="plat"></div>
    <div><div class="onglets">${jeu.ordre.map(id => `<button data-tv="${id}" class="${id === testVue ? "sel" : ""}">${esc(jeu.noms[id])}</button>`).join("")}</div>
      <label class="row small" style="margin:0 0 8px"><input type="checkbox" id="tsuiv" ${suivre ? "checked" : ""}> Afficher automatiquement le joueur qui doit agir</label>
      <div class="tel" id="ttel"></div></div></div>`;
  main.querySelectorAll("[data-tv]").forEach(b => b.onclick = () => { suivre = false; testVue = b.dataset.tv; resetUi(); rendre(); });
  document.getElementById("tsuiv").onchange = e => { suivre = e.target.checked; resetUi(); rendre(); };
  const tel = document.getElementById("ttel"), haut = tel.scrollTop;
  try { $app = document.getElementById("tplat"); rendrePlateau(); $app = tel; rendreJoueur(); }
  finally { $app = main; }
  tel.scrollTop = haut;
}
let pieceVue = "";
function animerPiece() {
  const c = jeu?.piece;
  if (!c || c.id === pieceVue) return;
  pieceVue = c.id;
  if (Date.now() - (c.t || 0) > 15000) return;
  if (!(vue() === "plateau" || test || monId() === c.par)) return;
  const d = document.createElement("div");
  d.className = "piece-anim"; d.setAttribute("role", "status");
  d.innerHTML = `<div class="boite"><div class="piece ${c.pile ? "pile" : "face"}"><span class="f1">PILE</span><span class="f2">FACE</span></div>
    <strong>${c.pile ? "Pile : belle prise !" : "Face : raté…"}</strong><span>${icone("harpon")} ${esc(jeu.noms[c.par])} · ${esc(jeu.noms[c.cible])} atteint ${esc(c.palier)}</span>
    <span class="small">${c.pile ? "+1 jeton au prochain tour" : "Pas de jeton cette fois"}</span></div>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3400);
}
let taureauVu = "";
function animerTaureau() {
  const c = jeu?.taureauAnim;
  if (!c || c.id === taureauVu) return;
  taureauVu = c.id;
  if (Date.now() - (c.t || 0) > 15000) return;
  if (!(vue() === "plateau" || test || monId() === c.par || monId() === c.cible)) return;
  const d = document.createElement("div");
  d.className = "taureau-anim"; d.setAttribute("role", "status");
  d.innerHTML = `<span class="bete" aria-hidden="true">${icone("taureau")}</span><strong>Piscine !</strong><span>${esc(jeu.noms[c.par])} charge ${esc(jeu.noms[c.cible])}</span>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}
let clocheVue = "";
function animerCloche() {
  const c = jeu?.cloche;
  if (!c || c.id === clocheVue) return;
  clocheVue = c.id;
  if (Date.now() - (c.t || 0) > 15000) return;
  const v = vue();
  if (!(v === "plateau" || test || monId() === c.par || monId() === c.cible)) return;
  const d = document.createElement("div");
  d.className = "cloche-anim"; d.setAttribute("role", "status");
  d.innerHTML = `<div><span class="cl">${icone("cloche")}</span><strong>${c.n === 1 ? "DING !" : "DONG !"}</strong><span>${esc(jeu.noms[c.par])} sonne ${esc(jeu.noms[c.cible])}</span></div>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2400);
}
function rendre() {
  setTimeout(animerCloche, 0); setTimeout(animerTaureau, 0); setTimeout(animerPiece, 0);
  const v0 = vue();
  $app.className = v0 === "plateau" ? "plat large" : "";
  if (v0 === "test") { rendreTest(); return; }
  if (!init && vue() !== "accueil") { $app.innerHTML = `<p class="muted">Chargement…</p>`; return; }
  if (!db && vue() !== "accueil") { $app.innerHTML = `<h1>Partie en ligne indisponible</h1><p>Le module de connexion n’a pas pu se charger. Recharge la page.</p><p><a href="#">Retour</a></p>`; return; }
  if (!canWrite && vue() !== "accueil") { $app.innerHTML = `<h1>Accès en lecture seule</h1><p>Pour jouer, demande à la personne qui t’a partagé le jeu un accès Contributeur.</p><p><a href="#">Retour</a></p>`; return; }
  const v = vue();
  if (v === "plateau") rendrePlateau(); else if (v === "joueur") rendreJoueur(); else rendreAccueil();
}
function demarrerVue() {
  erreur = ""; resetUi(); code = null;
  const v = vue();
  test = v === "test"; jeu = null;
  if (db) { const saved = v === "plateau" ? load("jdd-plateau") : v === "joueur" ? load("jdd-joueur") : null; if (saved) abonner(saved); }
  rendre();
}
rendre();
try { db = creerReseau(window.Peer, () => vue() === "plateau"); } catch (e) { db = null; }
init = true; demarrerVue();
</script>
